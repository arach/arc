name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build library
        run: bun run build:lib

      - name: Build viewer
        run: bun run --filter '@arach/arc-viewer' build

      - name: Build isometric
        run: |
          bun run build:iso
          mkdir -p packages/iso/dist
          cp dist-iso/*.js packages/iso/dist/
          cp dist-iso/*.d.ts packages/iso/dist/ 2>/dev/null || true

      - name: Get version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set version (from tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version ${{ steps.tag_version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - name: Set version (manual)
        if: github.event_name == 'workflow_dispatch'
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Publish @arach/arc (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @arach/arc-viewer (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/viewer
        run: |
          npm version ${{ steps.tag_version.outputs.VERSION }} --no-git-tag-version --allow-same-version
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @arach/arc-iso (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/iso
        run: |
          npm version ${{ steps.tag_version.outputs.VERSION }} --no-git-tag-version --allow-same-version
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @arach/arc (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: Would publish @arach/arc"
            bun run check:dist
            npm pack --dry-run --ignore-scripts
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @arach/arc-viewer (manual)
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/viewer
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: Would publish @arach/arc-viewer"
            npm publish --dry-run --access public
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @arach/arc-iso (manual)
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/iso
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: Would publish @arach/arc-iso"
            npm publish --dry-run --access public
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
